<script>const styles=[
{id:'modern',name:'Modern',ko:'모던',cover:'2-1',tags:'CONTRAST · CLEAN LINES · DARK WOOD',headline:'선명한 선과 차분한 대비',desc:'블랙과 다크 우드, 간결한 가구의 형태가 중심이 되는 공간을 모았습니다. 은은한 조명과 밝은 바탕이 짙은 색감에 균형을 더합니다.',images:[['2-1','거실'],['2-2','주방'],['2-3','침실'],['2-4','서재'],['2-5','개인실']]},
{id:'white',name:'White',ko:'화이트',cover:'3-1',tags:'CREAM · SOFT LIGHT · OPEN SPACE',headline:'빛과 여백으로 채우는 일상',desc:'화이트와 크림 톤을 바탕으로 부드러운 빛과 소재의 질감을 담은 공간입니다. 곡선 가구와 밝은 우드가 편안한 분위기를 완성합니다.',images:[['3-1','거실'],['3-2','주방·다이닝'],['3-3','침실'],['3-4','복도']]},
{id:'natural',name:'Natural',ko:'내추럴',cover:'1-1',tags:'WOOD · LINEN · WARM TEXTURES',headline:'나무의 온기와 부드러운 질감',desc:'우드와 패브릭, 차분한 뉴트럴 컬러가 어우러지는 공간입니다. 거실과 침실부터 작은 생활 공간까지, 자연스러운 소재와 따뜻한 분위기를 함께 살펴보세요.',images:[['1-1','거실'],['1-2','주방·다이닝'],['1-3','침실'],['1-4','드레스룸'],['7-1','리빙·침실'],['7-2','리빙·침실의 다른 시선']]},
{id:'mid-century',name:'Mid-century Modern',ko:'미드센추리 모던',cover:'4-1',tags:'WALNUT · OLIVE · TIMELESS FORMS',headline:'깊이 있는 나무, 오래 머무는 취향',desc:'월넛 톤과 올리브 컬러, 간결한 가구의 다리와 형태가 어우러지는 공간입니다. 따뜻한 조명과 식물, 오브제로 공간에 깊이를 더했습니다.',images:[['4-1','거실'],['4-2','주방·다이닝'],['4-3','침실'],['4-4','현관·복도']]}

 {styleId:'modern',number:'01',name:'Modern Balance',cover:'2-1',images:styles[0].images},

const main=document.querySelector('#main'),header=document.querySelector('header'),menu=document.querySelector('#menu'),menuButton=document.querySelector('#menuButton');

const consultationBlock=()=>`<section class="consult-section"><p class="eyebrow">LET’S TALK ABOUT YOUR SPACE</p><h2>당신의 공간 이야기를 들려주세요.</h2><p>꾸미고 싶은 공간과 지금의 고민을 남겨주세요.<br>상담을 통해 필요한 서비스와 진행 범위를 함께 살펴봅니다.</p>${consultLink()}<small>네이버 폼이 새 창에서 열립니다.</small></section>`;
const faqs=[
['어떤 도움을 받을 수 있나요?','공간의 불편함과 생활 방식을 살펴보고, 가구 배치와 동선, 스타일과 색감, 가구·조명·소품 선택 방향을 제안합니다. 구체적인 작업 범위는 상담에서 정합니다.'],
['카운셀링과 스타일링 제안은 어떻게 다른가요?','카운셀링은 공간에 대한 고민을 정리하고 배치·스타일·구매 방향을 함께 살펴보는 상담입니다. 무드보드, 구체적인 제품 큐레이션, 배치안 등의 결과물이 필요한 경우 별도의 컨설팅 작업으로 범위를 안내합니다.'],
['공사 없이도 진행할 수 있나요?','네. 메종은 가구·조명·패브릭·소품과 배치를 중심으로 공간의 변화를 제안합니다. 철거, 구조 변경, 전기·설비 등 시공 업무는 서비스 범위에 포함되지 않습니다.'],
['기존 가구를 활용하거나 한 공간만 의뢰할 수 있나요?','유지하고 싶은 가구와 바꾸고 싶은 공간을 상담 폼에 적어주세요. 기존 가구의 크기와 상태, 공간의 조건을 살펴본 뒤 활용 방향과 필요한 작업 범위를 안내합니다.'],
['온라인으로도 상담할 수 있나요?','공간 사진과 도면, 치수 등 제공해 주신 자료를 바탕으로 비대면 상담과 스타일링 제안을 진행할 수 있습니다. 방문이 필요한 경우의 진행 가능 여부와 범위는 상담에서 별도로 안내합니다.'],
['상담 전에 무엇을 준비하면 좋을까요?','공간 전체가 보이는 사진, 도면이나 주요 치수, 유지할 가구의 크기, 좋아하는 공간 이미지, 예상 예산을 준비하면 도움이 됩니다. 자료가 모두 준비되지 않았더라도 현재 고민부터 폼에 남겨주세요.'],
['어떤 결과물을 받을 수 있나요?','의뢰 범위에 따라 공간 진단, 가구 배치 제안, 가구·소품 큐레이션, 무드보드를 포함한 공간 스타일링 제안서를 구성합니다. 실제 제공 항목과 형식은 작업 시작 전에 안내합니다.'],
['가구 구매나 배송·설치도 대신해 주나요?','현재는 가구·소품 선택과 배치에 대한 컨설팅을 제공하며 구매대행은 진행하지 않습니다. 제품 주문, 결제, 배송·설치는 고객이 각 판매처와 직접 진행합니다.'],
['비용과 작업 기간, 수정 범위는 어떻게 되나요?','대상 공간, 자료 준비 상태, 필요한 결과물과 작업량에 따라 달라집니다. 상담 후 비용·일정·수정 범위를 안내하며, 세부 조건을 확인한 뒤 진행 여부를 결정하실 수 있습니다.']
];
const serviceSections=()=>`<section class="services-section" id="services" aria-labelledby="servicesTitle"><div class="service-heading"><p class="eyebrow">SERVICES · MAISON HOMESTYLING</p><h2 id="servicesTitle">일상에 맞추어,<br>공간을 새롭게.</h2><p>취향과 생활 방식을 이해하는 것에서 시작합니다.<br>가구와 소재, 빛과 배치를 연결해 편안한 일상의 방향을 제안합니다.</p></div><div class="service-list">${[
['01','공간 진단과 카운셀링','공간의 고민, 생활 습관, 원하는 분위기를 살펴봅니다. 배치와 동선, 스타일과 색감의 방향을 함께 정리합니다.'],
['02','가구 배치와 동선 제안','공간의 크기와 쓰임, 유지할 가구를 고려해 배치를 제안합니다. 쉬는 곳과 생활하는 곳이 자연스럽게 이어지도록 살펴봅니다.'],
['03','가구·조명·소품 큐레이션','취향과 예산, 공간의 조건에 맞는 가구와 조명, 패브릭과 소품을 제안합니다. 제품을 선택할 때 확인할 크기와 소재도 함께 살펴봅니다.'],
['04','공간 스타일링 제안','무드보드와 색감, 소재의 조합으로 공간의 방향을 구체화합니다. 의뢰 범위에 맞추어 가구 큐레이션과 공간 스타일링 제안서를 구성합니다.']
].map(([n,t,d])=>`<article class="service-row"><span>${n}</span><div><h3>${t}</h3><p>${d}</p></div></article>`).join('')}</div><div class="service-delivery"><p class="eyebrow">YOUR SPACE, YOUR PLAN</p><p>공간 진단 · 가구 배치 · 제품 큐레이션 · 무드보드</p><small>제공 항목은 상담 후 확정한 작업 범위에 따라 달라집니다.</small></div><div class="process-section"><p class="eyebrow">HOW WE WORK</p><h3>상담부터 제안까지</h3><ol><li><span>01</span><h4>상담 신청</h4><p>상담 창에서 원하는 서비스와 연락처를 남깁니다.</p></li><li><span>02</span><h4>공간과 취향 확인</h4><p>사진·도면과 생활 방식, 예산을 살펴봅니다.</p></li><li><span>03</span><h4>진행 범위 안내</h4><p>작업 항목과 비용, 일정, 수정 범위를 정합니다.</p></li><li><span>04</span><h4>스타일링 제안</h4><p>정해진 범위에 맞추어 공간의 방향과 결과물을 제안합니다.</p></li></ol></div></section><section class="faq-section" id="faq" aria-labelledby="faqTitle"><div><p class="eyebrow">QUESTIONS & ANSWERS</p><h2 id="faqTitle">자주 묻는 질문</h2><p class="faq-intro">상담을 시작하기 전,<br>궁금한 점을 확인해 보세요.</p></div><div class="faq-list">${faqs.map(([q,a])=>`<details><summary>${q}<span class="faq-sign" aria-hidden="true"></span></summary><p>${a}</p></details>`).join('')}</div></section>`;

const footer=()=>`<footer><a href="#" class="footer-brand">MAISON</a><nav class="footer-nav" aria-label="하단 메뉴"><a href="#portfolio">포트폴리오</a><a href="#services">서비스 안내</a><a href="#faq">자주 묻는 질문</a>${consultLink('상담 신청','footer-consult')}</nav><span class="copyright">© ${new Date().getFullYear()} MAISON HOMESTYLING<br>공간에 담는 취향</span></footer>`;
function closeMenu(){menu.hidden=true;document.body.classList.remove('menu-open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','메뉴 열기')}
menuButton.onclick=()=>{const open=menu.hidden;menu.hidden=!open;document.body.classList.toggle('menu-open',open);menuButton.setAttribute('aria-expanded',String(open));menuButton.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기')};
document.querySelector('#menuProjects').innerHTML=styles.map((style,i)=>`<a href="#style/${style.id}"><span>0${i+1}</span><span class="menu-style-name">${style.ko}<small>${style.name}</small></span></a>`).join('');
function imageCard(item,i){return `<figure class="style-image"><button class="image-button" data-view="${i}" aria-label="${item.style} · ${item.room} 이미지 확대"><img src="${imagePath(item.file)}" alt="${item.style} 스타일 ${item.room}" loading="lazy" width="1536" height="1024"></button><figcaption><span>${item.style} · ${item.room}</span><span>이미지 보기</span></figcaption></figure>`}
function bindGallery(items){main.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>openLight(items,Number(button.dataset.view)))}
function filterPortfolio(id){const selected=styles.find(s=>s.id===id),items=selected?projectsFor(selected):projects;main.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===id)));main.querySelector('#styleGrid').innerHTML=items.map(projectCard).join('');main.querySelector('#portfolioCount').textContent=`${selected?selected.ko:'전체'} · ${items.length}개의 프로젝트`;const detailLink=main.querySelector('#styleDetailLink');detailLink.hidden=!selected;if(selected){detailLink.href=`#style/${selected.id}`;detailLink.textContent=`${selected.ko} 프로젝트 모아보기`;}}
function home(){header.classList.remove('dark');main.innerHTML=`<section class="hero" aria-label="스타일 컬렉션"><div class="hero-track">${styles.map((style,i)=>`<a class="panel" href="#style/${style.id}"><img src="${imagePath(style.cover)}" alt="${style.ko} 스타일 대표 이미지" ${i>1?'loading="lazy"':'fetchpriority="high"'}><div class="panel-caption"><p class="eyebrow">MAISON STYLE COLLECTION</p><h${i===0?'1':'2'}>${style.name}</h${i===0?'1':'2'}><p class="ko">${style.ko}</p><span class="view-link">스타일 살펴보기</span></div></a>`).join('')}</div><div class="hero-tools"><span class="hero-note">FIND YOUR WAY OF LIVING</span><div class="arrows"><button id="prev" aria-label="이전 스타일">이전</button><span class="count" id="heroCount">01 / 04</span><button id="next" aria-label="다음 스타일">다음</button></div></div></section><section class="intro"><div><p class="eyebrow">SPACES FOR YOUR TASTE</p><h2>Find your<br>kind of space.</h2></div><div class="intro-text">좋아하는 공간의 분위기를 찾아보세요.<br>선명한 모던, 빛을 담은 화이트,<br>온기 있는 내추럴과 미드센추리 모던.<br>취향에 가까운 스타일에서 공간의 힌트를 발견합니다.<br><a href="#about">메종 홈스타일링에 대하여</a></div></section><section class="style-portfolio" id="portfolio" aria-labelledby="portfolioTitle"><div class="portfolio-heading"><div><p class="eyebrow">EXPLORE BY STYLE</p><h2 id="portfolioTitle">스타일별 포트폴리오</h2></div><p>스타일을 선택하고, 프로젝트별 공간 이야기를 만나보세요.</p></div><div class="portfolio-filter" role="group" aria-label="포트폴리오 스타일 필터"><button data-filter="all" aria-pressed="true">전체</button>${styles.map(s=>`<button data-filter="${s.id}" aria-pressed="false">${s.ko}</button>`).join('')}</div><div class="portfolio-meta"><span id="portfolioCount" role="status" aria-live="polite">전체 · ${projects.length}개의 프로젝트</span><a id="styleDetailLink" hidden></a></div><div class="style-grid" id="styleGrid"></div></section>${serviceSections()}${consultationBlock()}${footer()}`;
const track=main.querySelector('.hero-track');function update(){const w=track.querySelector('.panel').offsetWidth,n=Math.round(track.scrollLeft/w);main.querySelector('#heroCount').textContent=`0${n+1} / 04`;main.querySelector('#prev').disabled=n===0;main.querySelector('#next').disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-5}track.addEventListener('scroll',update,{passive:true});main.querySelector('#prev').onclick=()=>track.scrollBy({left:-track.querySelector('.panel').offsetWidth,behavior:'smooth'});main.querySelector('#next').onclick=()=>track.scrollBy({left:track.querySelector('.panel').offsetWidth,behavior:'smooth'});main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>filterPortfolio(b.dataset.filter));filterPortfolio('all');update()}
function styleNavigation(style){return `<nav class="style-page-nav" aria-label="다른 스타일 보기">${styles.map(s=>`<a href="#style/${s.id}" ${s.id===style.id?'aria-current="page"':''}>${s.ko}</a>`).join('')}</nav>`}
function detail(style){const items=projectsFor(style);header.classList.add('dark');main.innerHTML=`<section class="detail-title style-title"><p class="eyebrow">MAISON STYLE COLLECTION</p><h1>${style.name}</h1><p class="subtitle">${style.ko} · ${items.length}개의 프로젝트</p>${styleNavigation(style)}</section><section class="style-projects" aria-label="${style.ko} 프로젝트 목록"><div class="style-introduction"><h2>${style.headline}</h2><p>${style.desc}</p></div><div class="project-list">${items.map(projectCard).join('')}</div></section><nav class="project-nav"><a href="#portfolio"><span class="eyebrow">ALL PROJECTS</span><strong>전체 포트폴리오</strong></a></nav>${consultationBlock()}${footer()}`}
function projectDetail(style,project){const items=projectImages(project,style),siblings=projectsFor(style),next=siblings[siblings.indexOf(project)+1];header.classList.add('dark');main.innerHTML=`<section class="detail-title style-title"><a class="project-back" href="#style/${style.id}">${style.ko} 프로젝트 목록</a><p class="eyebrow">${style.name.toUpperCase()} / PROJECT ${project.number}</p><h1>${project.name}</h1><p class="subtitle">${style.ko} ${project.number} · ${items.length}개의 이미지</p></section><button class="image-button" data-view="0" aria-label="${project.name} 대표 이미지 확대"><img class="detail-cover" src="${imagePath(project.cover)}" alt="${project.name} 대표 이미지"></button><section class="project-copy"><p class="eyebrow">${style.name.toUpperCase()} / ${project.number}</p><h2>${project.name}</h2><p>${project.styleId==='natural'&&project.number==='02'?'작은 공간 안에 휴식과 생활을 함께 담았습니다. 부드러운 곡선과 따뜻한 소재로 아늑한 일상을 제안합니다.':style.desc}</p></section><section class="style-detail-gallery" aria-label="${project.name} 상세 이미지">${items.slice(1).map((item,i)=>imageCard(item,i+1)).join('')}</section><nav class="project-nav" aria-label="프로젝트 이동"><a href="#style/${style.id}"><span class="eyebrow">${style.name.toUpperCase()} PROJECTS</span><strong>${style.ko} 목록</strong></a>${next?`<a href="${projectURL(next)}"><span class="eyebrow">NEXT PROJECT / ${next.number}</span><strong>${next.name}</strong></a>`:`<a href="#portfolio"><span class="eyebrow">ALL PROJECTS</span><strong>전체 포트폴리오</strong></a>`}</nav>${consultationBlock()}${footer()}`;bindGallery(items)}
function about(){header.classList.add('dark');main.innerHTML=`<section class="about-page"><p class="eyebrow">ABOUT MAISON HOMESTYLING</p><h1>A place<br>to be yourself.</h1><div class="about-layout"><img src="https://maison-spaces-seongho.suny-kim.chatgpt.site/assets/3-1.webp" alt="자연광과 부드러운 소재가 어우러지는 메종의 공간"><div><p class="eyebrow">공간에 담는 취향</p><h2>당신의 일상에서 시작하는<br>공간 디자인.</h2><p>메종 홈스타일링은 가구와 소품, 배치와 색의 조화를 통해 공간의 분위기를 제안합니다. 취향을 살피고 생활 방식을 이해하며, 매일 머무는 곳을 더 편안하게 만드는 방법을 고민합니다.</p><p>이 포트폴리오에서는 모던·화이트·내추럴·미드센추리 모던으로 분류한 다양한 공간을 만나볼 수 있습니다.</p><a class="social" href="https://www.instagram.com/maison.styling/" target="_blank" rel="noopener noreferrer">INSTAGRAM · @maison.styling</a></div></div></section>${consultationBlock()}${footer()}`}
function route(){closeMenu();if(lightbox.open)closeLight();const oldProject=location.hash.match(/^#project\/(\d+)$/);if(oldProject){const aliases={'1':'natural/project/01','2':'modern/project/01','3':'white/project/01','4':'mid-century/project/01','7':'natural/project/02'};location.replace(`#style/${aliases[oldProject[1]]||'natural'}`);return;}const match=location.hash.match(/^#style\/([a-z-]+)(?:\/project\/(\d+))?$/),style=match&&styles.find(s=>s.id===match[1]);if(style){const project=match[2]&&projectsFor(style).find(p=>p.number===match[2]);if(project){projectDetail(style,project);document.title=`${style.ko} ${project.number} · ${project.name} — MAISON`}else{detail(style);document.title=`${style.ko} 프로젝트 — MAISON`}}else if(location.hash==='#about'){about();document.title='About — MAISON'}else{home();document.title='MAISON — 스타일별 공간 포트폴리오'}if(['#services','#faq','#portfolio'].includes(location.hash)){requestAnimationFrame(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:'instant',block:'start'}))}else{window.scrollTo({top:0,behavior:'instant'})}}
const lightbox=document.querySelector('#lightbox');let lightItems=[],lightIndex=0;function showLight(){const item=lightItems[lightIndex];document.querySelector('#lightImage').src=imagePath(item.file);document.querySelector('#lightImage').alt=`${item.style} · ${item.room}`;document.querySelector('#lightCount').textContent=`${item.style} · ${item.room}   ${lightIndex+1} / ${lightItems.length}`}
function openLight(items,i){lightItems=items;lightIndex=i;showLight();lightbox.showModal();document.body.style.overflow='hidden'}
function closeLight(){lightbox.close();document.body.style.overflow=''}document.querySelector('#lightClose').onclick=closeLight;lightbox.addEventListener('close',()=>document.body.style.overflow='');function step(n){lightIndex=(lightIndex+n+lightItems.length)%lightItems.length;showLight()}document.querySelector('#lightPrev').onclick=()=>step(-1);document.querySelector('#lightNext').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(lightbox.open){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});window.addEventListener('hashchange',route);route();
</script>
